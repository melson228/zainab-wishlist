meta:
  environment: node
  toolchain:
    name: npm
    version: "20"

build:
  # standalone-сборка легче по RAM, чем обычный next start
  additionalCommands: >
    npm run build
    && cp -r public .next/standalone/
    && mkdir -p .next/standalone/.next
    && cp -r .next/static .next/standalone/.next/

run:
  command: PORT=80 HOSTNAME=0.0.0.0 node .next/standalone/server.js
  containerPort: 80
  persistenceMount: /data

